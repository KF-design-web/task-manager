<div class="task-list">
  <h2>My Tasks</h2>

  <!-- Add task form -->
  <div class="add-task">
    <input 
      type="text" 
      [(ngModel)]="newTaskName" 
      placeholder="Enter a new task..."
    />
    <button (click)="addTask()">Add Task</button>
  </div>

  <!-- Task list -->
  <div class="task-item" *ngFor="let task of tasks">
    <span>{{ task.completed ? '✅' : '⬜' }}</span>
    <a [routerLink]="['/task', task.id]" 
       [class.strikethrough]="task.completed">
      {{ task.name }}
    </a>
  </div>

</div>
