<div class="task-list">
  <h2>My Tasks</h2>
  
  <div class="task-item" *ngFor="let task of tasks">
    <span class="status" [class.done]="task.completed">
      {{ task.completed ? '✅' : '⬜' }}
    </span>
    <span class="task-name" [class.strikethrough]="task.completed">
      {{ task.name }}
    </span>
  </div>

</div>
